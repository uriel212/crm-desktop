# Genera los instaladores de la app de escritorio con jpackage:
#   - Windows: CRM-de-Ventas-<version>.exe
#   - macOS (Apple Silicon): CRM-de-Ventas-<version>.dmg
# Se ejecuta a mano (Actions > Instaladores > Run workflow) o al subir un tag vX.Y.Z.
# Los instaladores quedan para descargar en la sección "Artifacts" de cada ejecución.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  APP_NAME: CRM de Ventas
  APP_VERSION: 1.0.0
  MAIN_JAR: crm-desktop-0.0.1-SNAPSHOT.jar
  MAIN_CLASS: com.devsuj.crmdesktop.Launcher

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tipo: exe
            opciones: >-
              --win-menu --win-menu-group "CRM de Ventas" --win-shortcut
              --win-dir-chooser --win-per-user-install
              --win-upgrade-uuid F549BC5A-0E81-4C84-81DE-F617B25BA803
          - os: macos-latest
            tipo: dmg
            opciones: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # jpackage necesita WiX Toolset para crear el .exe en Windows.
      - name: Instalar WiX Toolset (solo Windows)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset -y --no-progress
          echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"

      # Copia el jar de la app y sus dependencias (JavaFX para este sistema operativo incluido)
      # en build/install/crm-desktop/lib.
      - name: Compilar
        run: ./gradlew installDist --no-daemon

      - name: Crear instalador
        run: |
          jpackage --type ${{ matrix.tipo }} \
            --name "$APP_NAME" --app-version "$APP_VERSION" --vendor "DevSUJ" \
            --input build/install/crm-desktop/lib \
            --main-jar "$MAIN_JAR" --main-class "$MAIN_CLASS" \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest instalador \
            ${{ matrix.opciones }}

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.tipo }}
          path: instalador/*
          if-no-files-found: error
