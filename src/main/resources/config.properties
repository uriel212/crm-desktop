# URL base de la API REST (crm-api). Cambiarla aquí, nunca en el código.
api.base-url=http://localhost:8080/api

# true = la app usa datos de prueba en memoria y NO llama a la API.
# Útil para demostrar la interfaz mientras el backend no tiene los endpoints listos.
# false = todo pasa por la API REST (modo normal).
api.datos-de-prueba=false
